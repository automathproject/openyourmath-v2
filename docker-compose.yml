# ./docker-compose.yml

version: '3.8'

services:
  # --- Service Caddy (le reverse proxy) ---
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"       # Pour le trafic HTTP et la redirection automatique
      - "443:443"     # Pour le trafic HTTPS
      - "443:443/udp" # Nécessaire pour le protocole moderne HTTP/3
    volumes:
      # Monter notre Caddyfile pour que Caddy lise sa configuration
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Utiliser un volume nommé pour stocker les certificats de manière permanente
      - caddy_data:/data
      # Utiliser un volume nommé pour la configuration interne de Caddy
      - caddy_config:/config

  # --- Service de votre Application ---
  app:
    image: ghcr.io/automathproject/openyourmath:2.2.3
    restart: always
    # Pas de 'ports' ici ! Caddy communique directement avec l'app
    # via le réseau interne de Docker.
    environment:
      - DATABASE_PATH=/app/data/exercises.sqlite
      - NODE_ENV=production
      - ORIGIN=https://openyourmath.org

# Définir les volumes nommés pour que Docker les gère automatiquement.
volumes:
  caddy_data:
  caddy_config: